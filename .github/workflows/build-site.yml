name: Build Ether site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: test -s dist/index.html

      - uses: actions/upload-artifact@v7
        with:
          name: ether-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
